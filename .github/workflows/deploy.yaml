name: Deployment workflow

on:
  pull_request:
  push:
    branches:
      - "master"
  workflow_dispatch:
    inputs:
      force:
        description: "Tag the tested image as latest even when not running from master"
        type: "boolean"
        required: false
        default: false

env:
  IMAGE_NAME: europe-docker.pkg.dev/crea-aq-data/creaengine/creaco2tracker
  WORKLOAD_IDENTITY_PROVIDER: projects/829505003332/locations/global/workloadIdentityPools/github-identity-pool/providers/github-identity-provider
  SERVICE_ACCOUNT: github-actions@crea-aq-data.iam.gserviceaccount.com

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
      sha_tag: ${{ steps.image.outputs.sha_tag }}
      latest_tag: ${{ steps.image.outputs.latest_tag }}
      test_tag: ${{ steps.image.outputs.test_tag }}
      artifact_name: ${{ steps.image.outputs.artifact_name }}
    steps:
      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          echo "test_tag=creaco2tracker-production-test:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=creaco2tracker-production-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  test-image:
    name: build test image
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image for tests
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: Dockerfile
          tags: ${{ needs.metadata.outputs.test_tag }}
          outputs: type=docker,dest=/tmp/creaco2tracker-production.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_pat=${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}

      - name: Upload test image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}
          path: /tmp/creaco2tracker-production.tar
          retention-days: 1

  test:
    name: test in container
    runs-on: ubuntu-latest
    needs:
      - metadata
      - test-image
    permissions:
      contents: read
    env:
      TEST_TAG: ${{ needs.metadata.outputs.test_tag }}
      R_KEEP_PKG_SOURCE: "yes"
      CREA_DB_PRODUCTION: ${{ secrets.CREA_DB_PRODUCTION }}
      POWER_DB_PRODUCTION: ${{ secrets.POWER_DB_PRODUCTION }}
      AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
      API_KEY: ${{ secrets.API_KEY }}
      EMBER_KEY: ${{ secrets.EMBER_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
      RUN_CLIENT_INTEGRATION_TESTS: TRUE
    steps:
      - name: Download test image
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}
          path: /tmp

      - name: Load test image
        shell: bash
        run: docker load --input /tmp/creaco2tracker-production.tar

      - name: Run testthat
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e R_KEEP_PKG_SOURCE \
            -e CREA_DB_PRODUCTION \
            -e POWER_DB_PRODUCTION \
            -e AGSI_API_KEY \
            -e API_KEY \
            -e EMBER_KEY \
            -e EIA_API_KEY \
            -e GITHUB_PAT \
            -e RUN_CLIENT_INTEGRATION_TESTS \
            "$TEST_TAG" \
            "devtools::test(reporter = 'summary')"

  push-sha:
    name: push sha image
    runs-on: ubuntu-latest
    needs:
      - metadata
      - test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    env:
      TEST_TAG: ${{ needs.metadata.outputs.test_tag }}
      SHA_TAG: ${{ needs.metadata.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker
        shell: bash
        run: gcloud auth configure-docker europe-docker.pkg.dev --quiet

      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}
          path: /tmp

      - name: Push tested image with SHA tag
        shell: bash
        run: |
          set -euo pipefail
          docker load --input /tmp/creaco2tracker-production.tar
          docker tag "$TEST_TAG" "$SHA_TAG"
          docker push "$SHA_TAG"

  push-latest:
    name: tag latest
    runs-on: ubuntu-latest
    needs:
      - metadata
      - push-sha
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.force)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Tag SHA image as latest
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts docker tags add \
            "${{ needs.metadata.outputs.sha_tag }}" \
            "${{ needs.metadata.outputs.latest_tag }}" \
            --quiet
